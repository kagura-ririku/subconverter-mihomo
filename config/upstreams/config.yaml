mixed-port: 7890
allow-lan: false
mode: rule
unified-delay: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
  respect-rules: true
  nameserver:
    - https://1.1.1.1/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query

proxies:
  - name: "HK Example 01"
    type: ss
    server: hk.example.com
    port: 443
    cipher: aes-128-gcm
    password: change-me

  - name: "JP Example 01"
    type: ss
    server: jp.example.com
    port: 443
    cipher: aes-128-gcm
    password: change-me

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "HK Example 01"
      - "JP Example 01"
      - DIRECT

rules:
  - DOMAIN-SUFFIX,example.com,DIRECT
  - MATCH,PROXY
